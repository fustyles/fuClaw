<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fuClaw — 對話歷史紀錄</title>
<style>
  :root {
    --font-main: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans TC', sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
    --bg:        #f5f7ff;
    --surface:   #ffffff;
    --surface2:  #f0f3ff;
    --border:    #e2e8ff;
    --accent:    #4f6ef7;
    --accent2:   #7c3aed;
    --text:      #1a1d2e;
    --text2:     #4a5270;
    --text3:     #9098b8;
    --success:   #10b981;
    --user-bg:   linear-gradient(135deg, #4f6ef7, #7c3aed);
    --ai-bg:     #ffffff;
    --radius:    16px;
    --header-h:  64px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: var(--font-main);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .shell {
    display: flex;
    flex-direction: column;
    height: calc(100dvh - 58px);
    max-width: 780px;
    margin: 0 auto;
    background: var(--bg);
  }

  /* ── header ── */
  .header {
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: 0 1px 12px rgba(79,110,247,.06);
  }

  .header-logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #4f6ef7, #7c3aed);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(79,110,247,.3);
    position: relative; overflow: hidden;
  }
  .header-logo::before {
    content: '';
    position: absolute; inset: 0;
    background: conic-gradient(transparent 30%, rgba(255,255,255,.2) 50%, transparent 70%);
    animation: spin 4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .header-logo svg { position: relative; z-index: 1; }

  .header-title {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -.01em;
    color: var(--text);
  }
  .header-sub {
    font-size: .72rem;
    color: var(--text3);
    margin-top: 1px;
  }

  .header-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: .72rem;
    color: var(--text3);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--success);
    animation: blink 2.5s ease-in-out infinite;
  }
  .status-dot.loading {
    background: #f59e0b;
    animation: pulse-dot .8s ease-in-out infinite;
  }
  @keyframes blink     { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes pulse-dot { 0%,100%{transform:scale(1)} 50%{transform:scale(1.4)} }

  .refresh-btn {
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text2);
    transition: transform .5s ease, background .15s, border-color .15s;
    flex-shrink: 0;
  }
  .refresh-btn:hover   { background: white; border-color: var(--accent); color: var(--accent); }
  .refresh-btn:active  { transform: scale(.92); }
  .refresh-btn.spinning svg { animation: spin-refresh .7s linear infinite; }
  .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }
  @keyframes spin-refresh { to { transform: rotate(360deg); } }

  /* ── messages ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── bubble ── */
  .msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: msg-in .25s ease;
  }
  @keyframes msg-in {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .msg.user { align-items: flex-end; }
  .msg.ai   { align-items: flex-start; }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .msg.user .msg-row { flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: .68rem;
    font-weight: 600;
    flex-shrink: 0;
    margin-bottom: 2px;
    font-family: var(--font-main);
  }
  .avatar.user-av   { background: linear-gradient(135deg, #4f6ef7, #7c3aed); color: white; }
  .avatar.system-av { background: linear-gradient(135deg, #64748b, #334155); color: white; }
  .avatar.model-av  { background: linear-gradient(135deg, #06b6d4, #4f6ef7); color: white; }

  .bubble {
    max-width: min(72%, 560px);
    padding: 11px 15px;
    border-radius: 16px;
    font-size: .9rem;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--font-main);
  }
  .msg.user .bubble {
    background: var(--user-bg);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 16px rgba(79,110,247,.3);
  }
  .msg.ai .bubble {
    background: var(--ai-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }

  .msg-meta {
    font-size: .65rem;
    color: var(--text3);
    padding: 0 4px;
    font-family: var(--font-mono);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .msg.user .msg-meta { flex-direction: row-reverse; }
  .msg-source {
    font-family: var(--font-main);
    font-weight: 600;
    letter-spacing: .02em;
  }
  .msg-source.system { color: #64748b; }
  .msg-source.model  { color: #4f6ef7; }

  /* ── empty state ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text3);
    text-align: center;
    padding-bottom: 40px;
    pointer-events: none;
  }
  .empty-icon {
    width: 64px; height: 64px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
  }
  .empty-title { font-size: .95rem; font-weight: 500; color: var(--text2); }
  .empty-hint  { font-size: .78rem; line-height: 1.6; max-width: 240px; }

  /* ── error toast ── */
  .err-toast {
    display: none;
    position: fixed;
    bottom: 78px;
    left: 50%; transform: translateX(-50%);
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    border-radius: 10px;
    padding: 9px 18px;
    font-size: .8rem;
    font-family: var(--font-main);
    z-index: 100;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,.1);
    animation: fade-up .25s ease;
  }
  @keyframes fade-up {
    from { opacity:0; transform:translateX(-50%) translateY(6px); }
    to   { opacity:1; transform:translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>

<div class="shell">

  <div class="header">
    <div class="header-logo">
      <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="9"  r="4" fill="white" opacity=".95"/>
        <circle cx="7"  cy="20" r="3" fill="white" opacity=".8"/>
        <circle cx="21" cy="20" r="3" fill="white" opacity=".8"/>
        <line x1="14" y1="13" x2="7"  y2="17" stroke="white" stroke-width="1.5" opacity=".7"/>
        <line x1="14" y1="13" x2="21" y2="17" stroke="white" stroke-width="1.5" opacity=".7"/>
        <line x1="7"  y1="20" x2="21" y2="20" stroke="white" stroke-width="1.5" opacity=".4"/>
      </svg>
    </div>
    <div>
      <div class="header-title">fuClaw</div>
      <div class="header-sub">對話歷史紀錄</div>
    </div>
    <div class="header-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
      <button class="refresh-btn" id="refreshBtn" onclick="loadHistory()" title="重新載入">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">&#10022;</div>
      <div class="empty-title">尚無歷史對話紀錄</div>
      <div class="empty-hint">按右上角重整按鈕重新載入。</div>
    </div>
  </div>

</div>

<div class="err-toast" id="errToast"></div>

<script>
  var messagesEl  = document.getElementById('messages');
  var statusDot   = document.getElementById('statusDot');
  var statusText  = document.getElementById('statusText');
  var refreshBtn  = document.getElementById('refreshBtn');
  var isLoading   = false;

  function escHtml(str) {
    return str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // role -> bubble side / avatar style / source label
  //   "user"           -> user bubble (right)
  //   "model"          -> AI bubble (left), labeled "Gemini"
  //   "system" / other -> AI bubble (left), labeled "System"
  function roleInfo(role) {
    if (role === 'user') {
      return { side: 'user', avCls: 'user-av', avChar: 'U', label: '' };
    }
    if (role === 'model') {
      return { side: 'ai', avCls: 'model-av', avChar: 'AI', label: 'Gemini', labelCls: 'model' };
    }
    return { side: 'ai', avCls: 'system-av', avChar: 'S', label: 'System', labelCls: 'system' };
  }

  function appendMsg(role, text, time, isHtml) {
    var emptyState = document.getElementById('emptyState');
    if (emptyState) emptyState.style.display = 'none';

    var info = roleInfo(role);

    var msg = document.createElement('div');
    msg.className = 'msg ' + info.side;

    var content = isHtml ? text : escHtml(text);

    var metaParts = '';
    if (info.label) {
      metaParts += '<span class="msg-source ' + info.labelCls + '">' + info.label + '</span>';
    }
    if (time) {
      metaParts += '<span>' + escHtml(time) + '</span>';
    }

    msg.innerHTML =
      '<div class="msg-row">' +
        '<div class="avatar ' + info.avCls + '">' + info.avChar + '</div>' +
        '<div class="bubble">' + content + '</div>' +
      '</div>' +
      (metaParts ? '<div class="msg-meta">' + metaParts + '</div>' : '');

    messagesEl.appendChild(msg);
  }

  function resetMessages() {
    messagesEl.innerHTML =
      '<div class="empty-state" id="emptyState">' +
        '<div class="empty-icon">&#10022;</div>' +
        '<div class="empty-title">尚無歷史對話紀錄</div>' +
        '<div class="empty-hint">按右上角重整按鈕重新載入。</div>' +
      '</div>';
  }

  function scrollBottom() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  function setLoading(loading) {
    isLoading = loading;
    refreshBtn.disabled = loading;
    if (loading) {
      statusDot.className = 'status-dot loading';
      statusText.textContent = '載入中...';
      refreshBtn.className = 'refresh-btn spinning';
    } else {
      statusDot.className = 'status-dot';
      statusText.textContent = 'Ready';
      refreshBtn.className = 'refresh-btn';
    }
  }

  function showError(msg) {
    var t = document.getElementById('errToast');
    t.textContent = '⚠ ' + msg;
    t.style.display = 'block';
    setTimeout(function() { t.style.display = 'none'; }, 4000);
  }

  // ── history parsing ──

  // A single message's raw "content" looks like one of:
  //   "請幫我開綠燈\n\nRTC current time: 2026/8/8 18:00:03\n<MQTT> 2026/8/8 18:00:03"
  //   "請問目前使用的是 ...\n<MQTT> 2026/8/8 18:00:03"
  //   "Current Device IP: 192.168.0.29"                      (no trailing metadata)
  // Strip the trailing "<TAG> [timestamp]" line and the trailing
  // "\n\nRTC current time: ..." block; use whichever timestamp is
  // found as the bubble's displayed time.
  function parseMessageContent(content) {
    var text = String(content);
    var time = '';

    var tagMatch = text.match(/\n<[A-Za-z0-9_]+>(?:\s+([^\n]+))?\s*$/);
    if (tagMatch) {
      if (tagMatch[1]) time = tagMatch[1].trim();
      text = text.slice(0, tagMatch.index);
    }

    var rtcMatch = text.match(/\n\nRTC current time:\s*([^\n]+)\s*$/);
    if (rtcMatch) {
      if (!time) time = rtcMatch[1].trim();
      text = text.slice(0, rtcMatch.index);
    }

    return { text: text.trim(), time: time };
  }

  // GET /history returns text/plain that looks like a JSON array with
  // the opening "[" missing and a stray leading comma, e.g.:
  //   , {"role":"user","content":"..."}, {"role":"model","content":"..."}
  // Turn that into valid JSON: drop the leading comma, wrap in [ ].
  function toJsonArrayText(raw) {
    var t = raw.trim();
    t = t.replace(/^,/, '').trim();
    t = t.replace(/,\s*$/, '');
    return '[' + t + ']';
  }

  function loadHistory() {
    if (isLoading) return;
    setLoading(true);

    fetch('/history')
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function(raw) {
        resetMessages();

        if (!raw || !raw.trim()) return;

        var jsonText = toJsonArrayText(raw);
        var history;
        try {
          history = JSON.parse(jsonText);
        } catch (e) {
          // Data may have been truncated mid-object (e.g. log rotation).
          // Retry using only the last complete "}" we can find.
          var lastBrace = raw.lastIndexOf('}');
          if (lastBrace === -1) {
            showError('歷史紀錄格式解析失敗');
            return;
          }
          try {
            jsonText = toJsonArrayText(raw.slice(0, lastBrace + 1));
            history = JSON.parse(jsonText);
          } catch (e2) {
            console.error('History parse failed:', e2, jsonText);
            showError('歷史紀錄格式解析失敗');
            return;
          }
        }

        history.forEach(function(item) {
          if (!item || typeof item.content !== 'string') return;

          var parsed = parseMessageContent(item.content);
          if (!parsed.text) return;

          var isHtml = parsed.text.indexOf('data:image') !== -1;
          appendMsg(item.role, parsed.text, parsed.time, isHtml);
        });

        scrollBottom();
      })
      .catch(function(err) {
        showError('無法載入歷史紀錄 (' + err.message + ')');
      })
      .finally(function() {
        setLoading(false);
      });
  }

  loadHistory();
</script>

<!-- fuClaw Global Nav Bar -->
<style>
  .fc-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(220,228,255,.9);
    display: flex; justify-content: space-around; align-items: stretch;
    height: 58px;
    box-shadow: 0 -4px 24px rgba(79,110,247,.10);
    font-family: -apple-system,'Segoe UI','Noto Sans TC',sans-serif;
  }
  .fc-nav a {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; text-decoration: none;
    color: #8892b0; font-size: .6rem; font-weight: 500;
    letter-spacing: .03em; transition: color .2s;
    -webkit-tap-highlight-color: transparent;
    padding: 6px 2px 4px;
  }
  .fc-nav a:hover { color: #4f6ef7; }
  .fc-nav a.fc-active { color: #4f6ef7; }
  .fc-nav a .fc-ico {
    width: 28px; height: 28px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; transition: background .2s, transform .15s;
  }
  .fc-nav a.fc-active .fc-ico { background: rgba(79,110,247,.12); transform: scale(1.08); }
  .fc-nav a:hover .fc-ico { background: rgba(79,110,247,.07); }
  body { padding-bottom: 68px !important; }
</style>
<nav class="fc-nav">
  <a href="/"           id="fcn-config"   title="System Config"><span class="fc-ico">&#9881;</span><span>Config</span></a>
  <a href="/agent"    id="fcn-agent"    title="Agent Config"><span class="fc-ico">&#129302;</span><span>Agent</span></a>
  <a href="/schedule"  id="fcn-schedule" title="Scheduler"><span class="fc-ico">&#128197;</span><span>Schedule</span></a>
  <a href="/chat"      id="fcn-chat"     title="AI Chat"><span class="fc-ico">&#128172;</span><span>Chat</span></a>
  <a href="/mqtt" id="fcn-mqtt"     title="MQTT Chat"><span class="fc-ico">&#128225;</span><span>MQTT</span></a>
</nav>
<script>
  (function(){
    var map={"/":"fcn-config","":"fcn-config","/agent":"fcn-agent",
             "/schedule":"fcn-schedule","/chat":"fcn-chat",
             "/mqtt":"fcn-mqtt"};
    var seg=location.pathname.replace(/\/$/,"") || "/";
    var el=document.getElementById(map[seg]); if(el) el.className+=" fc-active";
  })();
</script>

</body>
</html>
